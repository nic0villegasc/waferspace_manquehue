# Every macro of the chip: where its views come from and where it sits. The wafer.space IDs are required by the
# shuttle (ip/). croc_soc comes from macros/croc (make macro). An own pad cell goes here too, with its gds, lef and
# vh, and no instances entry (the pad ring places it).
MACROS:
  gf180mcu_ws_ip__qrcode_id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__qrcode_id/gds/gf180mcu_ws_ip__qrcode_id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__qrcode_id/lef/gf180mcu_ws_ip__qrcode_id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__qrcode_id/vh/gf180mcu_ws_ip__qrcode_id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__qrcode_id/lib/gf180mcu_ws_ip__qrcode_id.lib
    instances:
      qrcode_id:
        location: [26, 26]
        orientation: N

  gf180mcu_ws_ip__shuttle_id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__shuttle_id/gds/gf180mcu_ws_ip__shuttle_id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__shuttle_id/lef/gf180mcu_ws_ip__shuttle_id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__shuttle_id/vh/gf180mcu_ws_ip__shuttle_id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__shuttle_id/lib/gf180mcu_ws_ip__shuttle_id.lib
    instances:
      shuttle_id:
        location: [26, 175.6]
        orientation: E

  gf180mcu_ws_ip__project_id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__project_id/gds/gf180mcu_ws_ip__project_id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__project_id/lef/gf180mcu_ws_ip__project_id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__project_id/vh/gf180mcu_ws_ip__project_id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__project_id/lib/gf180mcu_ws_ip__project_id.lib
    instances:
      project_id:
        location: [175.6, 26]
        orientation: N

  gf180mcu_ws_ip__marker:
    gds:
      - dir::../ip/gf180mcu_ws_ip__marker/gds/gf180mcu_ws_ip__marker.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__marker/lef/gf180mcu_ws_ip__marker.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__marker/vh/gf180mcu_ws_ip__marker.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__marker/lib/gf180mcu_ws_ip__marker.lib
    instances:
      marker:
        location: ["expr::($DIE_AREA[2] - (245 + 36))", "expr::($DIE_AREA[3] - (245 + 36))"]
        orientation: N

  gf180mcu_ws_ip__logo:
    gds:
      - dir::../ip/gf180mcu_ws_ip__logo/gds/gf180mcu_ws_ip__logo.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__logo/lef/gf180mcu_ws_ip__logo.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__logo/vh/gf180mcu_ws_ip__logo.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__logo/lib/gf180mcu_ws_ip__logo.lib
    instances:
      wafer_space_logo:
        location: [26, "expr::$DIE_AREA[3] - 169.25"]
        orientation: N

  # Modified DVDD pad without clamp (macros/pad_nc): the DVDD pin is the bond pad of a DC-DC output (PSx_Vc_n).
  # An own pad cell has no instances entry: the pad ring places it (padring.txt).
  gf180mcu_fd_io__dvdd_no_clamp:
    gds:
      - dir::../macros/pad_nc/gf180mcu_fd_io__dvdd_no_clamp.gds
    lef:
      - dir::../macros/pad_nc/gf180mcu_fd_io__dvdd_no_clamp.lef
    vh:
      - dir::../macros/pad_nc/gf180mcu_fd_io__dvdd_no_clamp.v

  # croc_soc from a manquehue_chip run (macros/croc): GDS and LEF of the finished block, its port stub, and its
  # PrimeTime timing models, so the chip STA times through it.
  croc_soc:
    gds:
      - dir::../macros/croc/croc_soc.gds
    lef:
      - dir::../macros/croc/croc_soc.lef
    vh:
      - dir::../macros/croc/croc_soc_bb.v
    lib:
      "*_tt_025C_5v00":
        - dir::../macros/croc/etm/croc_soc_typical.lib
      "*_ff_n40C_5v50":
        - dir::../macros/croc/etm/croc_soc_fast.lib
      "*_ss_125C_4v50":
        - dir::../macros/croc/etm/croc_soc_slow.lib
    instances:
      # Lower-left corner of the core, below the DC-DC layouts. manquehue_chip CROC_MACRO_LL must be the same.
      i_chip_core.i_croc_soc:
        location: [392, 404]
        orientation: N

