# Slot for the AC3E padframe (TO-GF180MCU-AC3E-2026_V1, 04_chip_top/padframe, proposal 2026-10-19_croc_shared_spi):
# the custom 108-pad 0p5x1 ring, DC-DC in the north half, CROC on pads 35 to 75 of the south half.
# Pad lists and librelane/padframe/pad_cfg.tcl come from the AC3E generator (generate_padframe.py) unchanged.

# Floorplanning
FP_SIZING: absolute
DIE_AREA: [0, 0, 1936, 5122]
# The pads end 376 um from the die edge. The core starts 28 um inside them, room for the narrow core ring
# (config.yaml), and is wide enough for the 1100 um croc_soc macro at x = 418.
CORE_AREA: [404, 404, 1532, 4718]

VERILOG_DEFINES: ["SLOT_AC3E"]

# Pad placement at the positions of padframe.yaml (instead of LibreLane's even spread)
PAD_CFG: dir::padframe/pad_cfg.tcl

PAD_SOUTH: [
    pad_spi_sd_o,
    pad_spi_cs1_o,
    pad_spi_cs0_o,
    pad_spi_sck_o,
    pad_gpio1_io,
    pad_gpio0_io,
    pad_CROC_vdd_2,
    pad_CROC_vss_2,
    pad_qspi_sd3_io,
    pad_qspi_sd2_io,
    pad_qspi_sd1_io
]

