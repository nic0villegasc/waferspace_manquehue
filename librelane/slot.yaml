# Die, core and pad lists of the AC3E chip. The pad lists at the end are written by make ring (do not edit them).

# Floorplanning
FP_SIZING: absolute
DIE_AREA: [0, 0, 1936, 5122]
# Core: from the core ring to just above croc_soc (top at 2202.32). The DC-DC layouts sit above it.
CORE_AREA: [392, 404, 1544, 2206]

VERILOG_DEFINES: ["SLOT_AC3E"]

# Pad placement at the positions of padframe.yaml (instead of LibreLane's even spread)
PAD_CFG: dir::pad_cfg.tcl

