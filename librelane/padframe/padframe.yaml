# Padframe: the single source of truth for the chip's pins and the pad ring.
# Views are generated from this file; never edit them by hand:
#   python 10_automation/scripts/render_floorplan.py    -> Pads layer of 04_chip_top/floorplan/floorplan.drawio,
#                                                          and the pin-list table 04_chip_top/pinlist/pinlist.md + .xlsx
#   python 10_automation/scripts/list_pins.py           -> the pins in the terminal (--pads in pad order, --summary)
#
# Padring: the pad ring.
#   Standard: true = a wafer.space configuration used unchanged; false = a custom ring.
#   Configuration: the wafer.space configuration name ({slot}_{density}_{edges}, e.g. 0p5x1_def_all;
#     list in Raw source SRC-WS-SLOTCONFIGS-001), or custom. BasedOn: for a custom ring, the configuration
#     it starts from. Only 0p5x1_def_all is in the imported template; the others exist only as pad counts.
#   Edges: sides with pads (all | top | lft | hor | ver | nwc | sec). Density: def | max | spc | num | custom.
#   PadLibrary: the I/O cell library (gf180mcu_fd_io).
#   PadsPerSide: pad positions per side (top = north, right = east, bottom = south, left = west). In a
#     custom ring the pitch follows from it, by LibreLane's pad-ring rule (so the floorplan and the GDS
#     agree): gap = (side length - pads x 75 µm) / (pads + 1), rounded down to whole µm, pads centred.
#     Side lengths for 0p5x1: 1174 µm north/south, 4360 µm east/west; at most 15 and 58 pads of 75 µm. A standard ring uses the template's positions (floorplan/reference.yaml).
#   MinPitch: the smallest pad pitch (µm) the wire bonding allows; a side with more pads than that
#     allows is an error. Pitch is pad-to-pad distance; the gap between pads is pitch - 75 µm.
#   FirstPad: where pad number 1 sits and which way pad numbers run, as <side>-<end of that side>:
#     West-North = the north end of the west side, numbers running down the west side (counterclockwise);
#     North-West = the west end of the north side, running east (clockwise). Also: North-East, East-North,
#     East-South, South-East, South-West, West-South.
#   UnusedPads: the pad type put at every pad number no pin uses (default bi_24t, an unused bidirectional
#     pad); drawn white in the floorplan.
#   Breaks: ring breaker cells, each After a pad number (in the gap between that pad and the next one),
#     with its Cell (brk5, 5 µm, the default; or brk2, 2 µm). A breaker cuts the ring's DVDD, DVSS and
#     VDD rails; VSS runs through. The ring is a closed loop, so it takes two or more breakers to split it
#     into supply segments; each segment then needs its own dvdd and dvss pads. All dvdd pads of one
#     segment are on the same DVDD rail (and dvss on DVSS): one supply net, listed as one pin.
#
# Pin fields, in this order (the file lists the pins by Area, DCDC first then CROC, and within an area
# by pad number; a pin with several pads by its lowest):
#   PadNumber (the physical pad: its number around the ring, from FirstPad; a list for a pin with several
#     pads, e.g. [4, 5]),
#   Area (DCDC | CROC | ... | to-decide),
#   Id (PAD-nnn: the pin's permanent identity, never changed or reused; other files refer to it),
#   Name (the pin / RTL port name),
#   Stage (functional group), Kind (power-stage | analog-supply | analog-signal | digital-signal |
#   digital-supply), Direction (power | input | output | bidir | to-decide),
#   PadType (gf180mcu_fd_io cell: bi_24t | bi_t | in_c | in_s | asig_5p0 | dvdd | dvss | to-decide),
#   optional PadTypeNote (why this pad type), Description, optional Note (open questions).
#
# Pins migrated on 2026-10-09 from 04_chip_top/planning.xlsx, sheet "Pin_list_V1" (chosen by the project
# lead); pin numbers of that sheet are no longer used (pad numbers replace them, 2026-10-13). Retired IDs:
# PAD-077 to PAD-088 (I/O ring supply pins, merged on 2026-10-13 into PAD-041 to PAD-044);
# PAD-076 (scan_te_i, proposal 2026-10-19_croc_shared_spi: CROC has no such port, testmode_i is PAD-048).
SchemaVersion: 3
Padring:
  Standard: false                 # custom: more supply pads and other positions than any standard ring
  Configuration: custom
  BasedOn: 0p5x1_def_all          # the template's default 0p5x1 ring (72 pads, 138/152 µm pitch)
  Edges: all
  Density: custom
  PadLibrary: gf180mcu_fd_io
  PadsPerSide:                    # 108 pads, in two halves (2026-10-13, project lead):
    top: 11                       #   DC-DC (north half):  pads 1-22 and 76-108
    right: 43                     #   CROC (south half):   pads 23-75
    bottom: 11
    left: 43
  MinPitch: 100                   # smallest pad pitch (µm) the wire bonder allows (chip-on-board assembly)
                                  # with 11 and 43 pads: pitch 104 µm (north/south), 100 µm (east/west)
  FirstPad: West-North            # pad 1 at the top-left corner, numbers running counterclockwise
  UnusedPads: bi_24t
  Breaks:                         # ring breaker cells: cut the DVDD, DVSS and VDD rails (VSS runs through)
    - After: 22                   # west side: DC-DC (pad 22) | CROC (pad 23)
      Cell: brk5
    - After: 75                   # east side: CROC (pad 75) | DC-DC (pad 76)
      Cell: brk5

