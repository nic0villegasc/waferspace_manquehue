# LibreLane flow of the AC3E chip. Used with slot.yaml (die, core, pads) and macros.yaml (macro views and places).
# croc_soc is a finished hard macro and the DC-DC layouts are merged after this flow (scripts/merge_dcdc.py), so
# the flow only places the pad ring, wires the CROC pads to croc_soc, and builds the power grid.

meta:
  version: 3
  flow: Chip
  substituting_steps:
    # Render the layout after the seal ring is added
    KLayout.Render: null
    +KLayout.SealRing: KLayout.Render
    # Checks that cannot pass here. LVS and DRC: the DC-DC layouts are not in this flow (the wafer.space precheck
    # of the merged GDS is the DRC sign-off). Disconnected pins: the DC-DC pad inputs are open on purpose. Power
    # grid and IR drop: the DC-DC segment supplies have no grid here. No fill and no density check for now.
    OpenROAD.IRDropReport: null
    Checker.PowerGridViolations: null
    Checker.LVS: null
    Checker.MagicDRC: null
    Checker.KLayoutDRC: null
    KLayout.Filler: null
    KLayout.Density: null
    Checker.KLayoutDensity: null
    Checker.DisconnectedPins: null

DESIGN_NAME: chip_top
VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv

PRIMARY_GDSII_STREAMOUT_TOOL: klayout
# The croc_soc cell already exists (empty) from its LEF. OverwriteCell puts the macro GDS into it. The default
# (RenameCell) leaves an empty croc_soc, and every KLayout check would skip the macro without a warning.
KLAYOUT_CONFLICT_RESOLUTION: OverwriteCell

PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

VDD_NETS:
- VDD
GND_NETS:
- VSS

# Cells with outputs left open on purpose: pads (unused Y of output pads, DC-DC pads), breakers, wafer.space IDs
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_fd_io__in_c
- gf180mcu_fd_io__in_s
- gf180mcu_fd_io__asig_5p0
- gf180mcu_fd_io__dvdd
- gf180mcu_fd_io__dvss
- gf180mcu_fd_io__dvdd_no_clamp
- gf180mcu_fd_io__brk5
- gf180mcu_ws_ip__qrcode_id
- gf180mcu_ws_ip__shuttle_id
- gf180mcu_ws_ip__project_id
- gf180mcu_ws_ip__logo
- gf180mcu_ws_ip__marker

# Clock on the clk_i pad output, at croc_soc's sign-off period (55 ns, 18.18 MHz)
CLOCK_PORT: clk_i
CLOCK_NET: pad_clk_i/Y
CLOCK_PERIOD: 55

# No clock tree, no buffering, no resizing: the only standard cells at this level are the tie cells of the pad
# inputs and the taps and fillers of the core rows.
RUN_CTS: false
RUN_POST_GPL_DESIGN_REPAIR: false
RUN_POST_GRT_DESIGN_REPAIR: false
RUN_POST_CTS_RESIZER_TIMING: false
RUN_POST_GRT_RESIZER_TIMING: false
DESIGN_REPAIR_BUFFER_INPUT_PORTS: false
DESIGN_REPAIR_BUFFER_OUTPUT_PORTS: false
RUN_HEURISTIC_DIODE_INSERTION: false

# Placement: the rows are only in the column east of croc_soc, so a tie cell can sit far from its pad. It drives a
# constant, so the long wire does not matter.
PL_TARGET_DENSITY_PCT: 35
PL_MAX_DISPLACEMENT_X: 2500
PL_MAX_DISPLACEMENT_Y: 2500
GRT_ALLOW_CONGESTION: true

# Antenna repair after detailed routing
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# Power grid (pdn_cfg.tcl). Each ring segment has its own supply net, so no connection by pin name: pdn_cfg.tcl
# connects the core cells and croc_soc to VDD and VSS itself.
PDN_CFG: dir::pdn_cfg.tcl
PDN_ENABLE_GLOBAL_CONNECTIONS: false
PDN_ENABLE_PINS: False
# Keep strap pieces that pdngen sees as dangling: the croc straps join the core ring only after pdngen (pdn_cfg.tcl)
PDN_SKIPTRIM: true
# Core stripes (vertical only: the rows are the tie-cell column east of croc_soc)
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75
# The core grid stops this far from the wafer.space ID macros (croc_soc has its own grid, pdn_cfg.tcl)
PDN_HORIZONTAL_HALO: 5
PDN_VERTICAL_HALO: 5
# Core ring: 5 um rings 2 um apart, 2 um outside the core (14 um in all), so it fits below the DC-DC layouts.
# It connects to the CROC supply pads on Metal2. croc_soc draws about 10 mA.
PDN_CORE_RING: True
PDN_CORE_RING_VWIDTH: 5
PDN_CORE_RING_HWIDTH: 5
PDN_CORE_RING_VSPACING: 2
PDN_CORE_RING_HSPACING: 2
PDN_CORE_RING_VOFFSET: 2
PDN_CORE_RING_HOFFSET: 2
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_CORE_VERTICAL_LAYER: Metal4
PDN_CORE_HORIZONTAL_LAYER: Metal3
PDN_CORE_RING_CONNECT_TO_PAD_LAYERS: [Metal2]

# Magic: report DRC but do not stop on it, and flatten these PDK cells to avoid false errors (contacts, the SRAM
# cells, and cells that draw 3.3 V devices in a higher cell).
ERROR_ON_MAGIC_DRC: False
MAGIC_GDS_FLATGLOB:
- "*_CDNS_*"
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"
# Several pads per supply net
MAGIC_EXT_UNIQUE: notopports

# KLayout: picture of the chip, and the DRC and antenna decks
KLAYOUT_RENDER_RESOLUTION: 2048
KLAYOUT_RENDER_OVERSAMPLING: 3
KLAYOUT_PROPERTIES: dir::gf180mcu_render.lyp
KLAYOUT_DRC_THREADS: 1
KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup"
  variant: ref::$PDK
  workers: max
KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: max
