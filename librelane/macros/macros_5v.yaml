  # croc_soc: the RISC-V SoC macro of manquehue_chip, integrated as a hardened macro (not resynthesized RTL).
  # All views come from one finished run of manquehue_chip, through the link croc_macro in the repository root
  # (not in git):  ln -sfn <manquehue_chip>/outputs/latest croc_macro
  #   croc_soc.gds, croc_soc.lef  Fusion Compiler (scripts/06_finish.tcl: create_frame + write_lef)
  #   croc_soc_bb.v               port stub written by 06_finish from the netlist of the same run
  #   etm/croc_soc_<corner>.lib   PrimeTime timing models (scripts/signoff/sta/extract_models.sh), so the
  #                               chip-level STA times through the macro
  croc_soc:
    gds:
      - dir::../croc_macro/croc_soc.gds
    lef:
      - dir::../croc_macro/croc_soc.lef
    vh:
      - dir::../croc_macro/croc_soc_bb.v
    lib:
      "*_tt_025C_5v00":
        - dir::../croc_macro/etm/croc_soc_typical.lib
      "*_ff_n40C_5v50":
        - dir::../croc_macro/etm/croc_soc_fast.lib
      "*_ss_125C_4v50":
        - dir::../croc_macro/etm/croc_soc_slow.lib
    instances:
      # Croc chip: lower-left corner of the core, so the DC-DC wrappers fit above it (croc_soc ends at y = 2202.32)
      # and the tie cells have rows east of it. Its pins were placed for an earlier pad position, so some wires run
      # along the macro edge.
      i_chip_core.i_croc_soc:
        location: [392, 404]
        orientation: N

