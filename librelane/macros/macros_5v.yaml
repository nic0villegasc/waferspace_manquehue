  # croc_soc -- external RISC-V SoC macro from the sibling manquehue_chip
  # project, integrated here as a hardened macro (not resynthesized RTL).
  # Physical views are referenced live from manquehue_chip's own outputs/latest/
  # rather than copied into this repo's ip/ tree, so a fresh croc_soc build
  # (make all in manquehue_chip) is picked up automatically without manual
  # re-syncing. GDS/LEF come straight from Fusion Compiler (06_finish.tcl:
  # create_frame + write_lef). The liberty views are PrimeTime timing models
  # extracted per corner from the finished run (scripts/pt/extract_models.sh,
  # written to outputs/latest/etm/), so the chip-level STA times through the
  # macro. The Verilog stub is hand-written and lives in
  # manquehue_chip/integration/ (it only changes when the port list does).
  croc_soc:
    gds:
      - dir::../../manquehue_chip/outputs/latest/croc_soc.gds
    lef:
      - dir::../../manquehue_chip/outputs/latest/croc_soc.lef
    vh:
      - dir::../../manquehue_chip/integration/croc_soc_blackbox.v
    lib:
      "*_tt_025C_5v00":
        - dir::../../manquehue_chip/outputs/latest/etm/croc_soc_typical.lib
      "*_ff_n40C_5v50":
        - dir::../../manquehue_chip/outputs/latest/etm/croc_soc_fast.lib
      "*_ss_125C_4v50":
        - dir::../../manquehue_chip/outputs/latest/etm/croc_soc_slow.lib
    instances:
      # Bottom-left of the core (core area x 442..1494, y 442..4680; croc_soc is
      # 1019.92 x 1790.48 um): 16 um in from the left core edge and 48 um above the
      # bottom edge. The bottom pads carry the QSPI/JTAG pins, so this keeps those nets
      # short. Keep the strip of standard-cell rows below the macro: at y=458 (no rows
      # below) detailed placement failed (DPL-0036) on buffers that repair_design puts
      # inside the macro footprint. The ID/logo/marker macros sit in the die corners
      # outside the core.
      i_chip_core.i_croc_soc:
        location: [458, 490]
        orientation: N
